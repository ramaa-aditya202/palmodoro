name: pomodoro_app
description: "Offline Pomodoro & Task Manager for Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shadcn_ui: ^0.56.3
  flutter_animate: ^4.5.2
  provider: ^6.1.5
  go_router: ^17.2.2
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.5
  audioplayers: ^6.7.1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  uuid: ^4.5.3
  intl: ^0.20.2
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon.png
    - assets/sounds/soft_kalimba/
    - assets/sounds/neon_pulse/
    - assets/sounds/orbit_bloom/
